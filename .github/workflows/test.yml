name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
  equality:
    # the references are synthetic texts with personal-data-shaped values: they live on Hugging Face
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: curl -fsSL -o references_int8.jsonl https://huggingface.co/apartejs/aparte-privacy/resolve/main/references_int8.jsonl
      - run: node packages/privacy/test/equality.mjs packages/privacy/model/privacy-v1-int8.bin references_int8.jsonl
  reader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r python/requirements.txt
      - run: python python/aparte_privacy/reader.py packages/privacy/model/privacy-v1-int8.bin "Appelle Jean Dupont au 06 12 34 56 78"
